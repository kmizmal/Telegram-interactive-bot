name: CI

on:
  push:
  pull_request:

jobs:
  uv-check:
    name: uv sync and smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.11.26"
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Byte-compile
        run: uv run --frozen --no-dev python -m compileall -q interactive-bot db scripts

      - name: Smoke check
        run: uv run --frozen --no-dev python scripts/smoke_test.py
