[project]
name = "telegram-interactive-bot"
version = "0.1.0"
description = "Telegram interactive bot - bidirectional customer service robot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue] >= 22.8",
    "python-dotenv >= 1.2.4",
    "sqlalchemy >= 2.1.9",
    "httpx >= 0.28.1",
    "pytz >= 2026.6",
    "apscheduler >= 3.11.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = []
