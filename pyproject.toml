[project]
name = "telegram-interactive-bot"
version = "0.1.0"
description = "Telegram interactive bot - bidirectional customer service robot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot >= 22.8",
    "python-dotenv >= 1.2.4",
    "httpx >= 0.28.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
